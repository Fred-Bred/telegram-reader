[project]
name = "telegram-reader"
version = "0.1.0"
description = "Telegram bot that turns photos and PDFs of printed pages into read-aloud audio"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
    "openai>=3,<4",
    "pymupdf>=1.28,<2",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]